<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نمایشگر سه‌بعدی CityGML با Cesium</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.107.1/Cesium.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.107.1/Widgets/widgets.min.css" rel="stylesheet">
    
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #000;
        }
        /* استایل پنل ابزارها و اطلاعات */
        #toolbar {
            position: absolute; top: 10px; left: 10px;
            background: rgba(42, 42, 42, 0.85); color: white;
            padding: 15px; border-radius: 5px; font-family: Tahoma, sans-serif;
            z-index: 10; min-width: 180px;
        }
        #coordinates {
            position: absolute; bottom: 30px; right: 10px;
            background: rgba(0, 0, 0, 0.75); color: #00ff00;
            padding: 10px; border-radius: 5px; font-family: monospace; direction: ltr;
            z-index: 10;
        }
        #infoPanel {
            position: absolute; top: 10px; right: 10px;
            background: rgba(42, 42, 42, 0.85); color: white;
            padding: 15px; border-radius: 5px; font-family: Tahoma, sans-serif;
            display: none; max-width: 300px; z-index: 10; overflow-x: hidden;
        }
        button {
            background-color: #3f51b5; color: white; border: none;
            padding: 8px 12px; margin: 4px 0; cursor: pointer; border-radius: 3px;
            width: 100%; font-family: Tahoma, sans-serif;
        }
        button:hover { background-color: #2c397f; }
        button.action-btn { background-color: #4caf50; }
        button.action-btn:hover { background-color: #388e3c; }
        button.danger-btn { background-color: #f44336; }
        button.danger-btn:hover { background-color: #d32f2f; }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>
    
    <div id="toolbar">
        <h3 style="margin-top:0; font-size: 16px;">ابزارهای پروژه</h3>
        <button id="zoomToModelBtn" class="action-btn">🎯 پرش به مدل سه‌بعدی</button>
        <hr style="border:0.5px solid #555; margin:10px 0;">
        <h4 style="margin: 5px 0; font-size: 14px;">ابزارهای ترسیم</h4>
        <button id="drawPointBtn">رسم نقطه</button>
        <button id="drawLineBtn">رسم خط</button>
        <button id="clearBtn" class="danger-btn">پاک کردن ترسیم‌ها</button>
        <p style="font-size: 11px; margin-top: 5px; color: #ccc;">برای رسم کلیک چپ کنید.</p>
    </div>

    <div id="coordinates">Lon: 0.000, Lat: 0.000, Alt: 0.00m</div>

    <div id="infoPanel">
        <h3>مشخصات عارضه (Identify)</h3>
        <div id="infoContent">هیچ عارضه‌ای انتخاب نشده است.</div>
    </div>

    <script>
        // ۱. راه اندازی نمایشگر Cesium با نقشه ماهواره‌ای آنلاین ArcGIS (بدون نیاز به توکن)
        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayer: Cesium.ImageryLayer.fromProviderAsync(
                Cesium.ArcGisMapServerImageryProvider.fromUrl(
                    'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
                )
            ),
            infoBox: false, 
            selectionIndicator: false,
            terrainProvider: undefined, 
            baseLayerPicker: false, 
            geocoder: false,
            animation: false, 
            timeline: false
        });

        let loadedTileset = null;

        // ۲. بارگذاری داده‌های 3D Tiles (فایل tileset.json)
        Cesium.Cesium3DTileset.fromUrl('./tileset.json', {
            maximumScreenSpaceError: 16
        }).then(function(tileset) {
            loadedTileset = tileset;
            viewer.scene.primitives.add(tileset);
            viewer.zoomTo(tileset); // زوم اولیه خودکار روی مدل
        }).catch(function(error) {
            console.error("خطا در بارگذاری داده‌های 3D Tiles: ", error);
        });

        // ۳. افزودن عملکرد دکمه اختصاصی "پرش به مدل"
        document.getElementById('zoomToModelBtn').onclick = () => {
            if (loadedTileset) {
                viewer.zoomTo(loadedTileset);
            } else {
                alert('مدل هنوز بارگذاری نشده است.');
            }
        };

        // ۴. بازتعریف عملکرد دکمه Home خودِ سزیوم (برای زوم روی مدل به جای کل زمین)
        if (viewer.homeButton) {
            viewer.homeButton.viewModel.command.beforeExecute.addEventListener(function(e) {
                e.cancel = true; // لغو رفتار پیش‌فرض
                if (loadedTileset) {
                    viewer.zoomTo(loadedTileset); // زوم روی مدل شما
                }
            });
        }

        // ==========================================
        // ۵. قابلیت نمایش مختصات
        // ==========================================
        const coordDiv = document.getElementById('coordinates');
        viewer.screenSpaceEventHandler.setInputAction(function(movement) {
            const cartesian = viewer.camera.pickEllipsoid(movement.endPosition, viewer.scene.globe.ellipsoid);
            if (cartesian) {
                const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
                const longitudeString = Cesium.Math.toDegrees(cartographic.longitude).toFixed(5);
                const latitudeString = Cesium.Math.toDegrees(cartographic.latitude).toFixed(5);
                const heightString = cartographic.height.toFixed(2);
                coordDiv.innerHTML = `Lon: ${longitudeString} <br> Lat: ${latitudeString} <br> Alt: ${heightString}m`;
            }
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        // ==========================================
        // ۶. قابلیت Identify (کلیک روی مدل و نمایش مشخصات)
        // ==========================================
        const infoPanel = document.getElementById('infoPanel');
        const infoContent = document.getElementById('infoContent');



        // ==========================================
        // ۷. قابلیت ترسیم (Draw)
        // ==========================================
        let drawMode = 'none'; 
        let activeLinePoints = [];

        document.getElementById('drawPointBtn').onclick = () => { drawMode = 'point'; activeLinePoints = []; };
        document.getElementById('drawLineBtn').onclick = () => { drawMode = 'line'; activeLinePoints = []; };
        document.getElementById('clearBtn').onclick = () => {
            viewer.entities.removeAll();
            drawMode = 'none';
            activeLinePoints = [];
        };

        viewer.screenSpaceEventHandler.setInputAction(function(click) {
            if (drawMode === 'none') {
                const feature = viewer.scene.pick(click.position);
                if (feature instanceof Cesium.Cesium3DTileFeature) {
                    const propertyIds = feature.getPropertyIds();
                    const rows = propertyIds.map(function(propId) {
                        return `<li><b>${propId}:</b> ${feature.getProperty(propId)}</li>`;
                    }).join('');
                    infoContent.innerHTML = propertyIds.length
                        ? `<ul style="padding-right:15px;text-align:right">${rows}</ul>`
                        : '<p>مشخصاتی برای این عارضه یافت نشد.</p>';
                    infoPanel.style.display = 'block';
                } else {
                    infoPanel.style.display = 'none';
                }
                return;
            }

            const earthPosition = viewer.scene.pickPosition(click.position) || viewer.camera.pickEllipsoid(click.position, viewer.scene.globe.ellipsoid);
            
            if (Cesium.defined(earthPosition)) {
                if (drawMode === 'point') {
                    viewer.entities.add({
                        position: earthPosition,
                        point: { pixelSize: 10, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 }
                    });
                } else if (drawMode === 'line') {
                    activeLinePoints.push(earthPosition);
                    
                    viewer.entities.add({
                        position: earthPosition,
                        point: { pixelSize: 6, color: Cesium.Color.YELLOW }
                    });

                    if (activeLinePoints.length >= 2) {
                        viewer.entities.add({
                            polyline: {
                                positions: [...activeLinePoints], 
                                width: 4,
                                material: Cesium.Color.YELLOW
                            }
                        });
                    }
                }
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    </script>
</body>
</html>
